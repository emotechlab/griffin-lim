[package]
name = "griffin-lim"
version = "0.2.0"
edition = "2021"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["science", "audio", "dsp"]
categories = ["science"]

[features]
default = ["ndarray-linalg/intel-mkl"]
# Do not use me unless you want a lot of npy files dumped in your CWD
debug_dump = ["ndarray-npy"]

[dependencies]
anyhow = "1.0.71"
lbfgsb = "0.1.0"
ndarray = { version = "0.17", features = ["approx", "rayon"] }
ndarray-linalg = "0.18"
ndarray-npy = { version = "0.10", optional = true }
ndarray-rand = "0.16"
ndarray-stats = "0.7"
rand = "0.9"
realfft = "3.5.0"
thiserror = "2"
tracing = "0.1.37"

[dev-dependencies]
approx = "0.5.1"
clap = { version = "4.4.7", features = ["derive"] }
float-cmp = "0.10.0"
hound = "3.5.1"
ndarray-npy = "0.10"
rand_isaac = "0.4.0"
